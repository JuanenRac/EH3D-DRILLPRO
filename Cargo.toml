[package]
name = "eh3d-drillpro"
version = "0.1.5"
edition = "2021"
description = "Open implementation of the Bungard CCD drilling workflow (file formats and machine protocol)"
license = "GPL-3.0-or-later"
repository = "https://github.com/JuanenRac/EH3D-DRILLPRO"
readme = "README.md"

[workspace]
members = ["protocol"]

[features]
default = []
gui = ["dep:eframe", "dep:png", "dep:arboard"]
console = ["dep:crossterm"]

[dependencies]
serde_json = "1"
eh3d-drillpro-protocol = { path = "protocol", features = ["serial", "node"] }
# jobs packed in ZIP archives (the shared code of the suite lives in EH3D-COMMON)
eh3d-archive = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/archive" }
# the files of the Bungard machines (drill file, tool table, machine configuration), shared with ROUTEPRO and the modern interface
eh3d-bungard-formats = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/formats" }
# several machines and stations at once: the answer of the server for the whole fleet
eh3d-fleet = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/fleet" }
eh3d-levelling = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/levelling" }
# the dry run and the summary before a job starts, and the languages they are said in
eh3d-summary = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/summary" }
eh3d-view = { version = ">=0.0.1", path = "../EH3D-COMMON/crates/view" }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard"], optional = true }

png = { version = "0.17", optional = true }
# only to know whether the clipboard holds text (the menu of the right button greys Paste out when it does not)
arboard = { version = "3", default-features = false, optional = true }
crossterm = { version = "0.28", optional = true }

# the window of Linux needs a windowing system chosen at build time (X11 and Wayland); Windows and macOS have their own
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "clipboard", "x11", "wayland"], optional = true }

[[bin]]
name = "drillpro"
path = "src/bin/drillpro.rs"
required-features = ["gui"]

[[bin]]
name = "drillpro-console"
path = "src/bin/drillpro_console.rs"
required-features = ["console"]

[[bin]]
name = "drillpro-plan"
path = "src/bin/drillpro_plan.rs"

[[test]]
name = "console"
required-features = ["console"]

[dev-dependencies]
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[profile.dev]
# a lighter debug build: the file and line of a panic stay, the full debug symbols (the bulk of the target folder) do not
debug = "line-tables-only"

# the icon and the version information of the Windows executable (build.rs; nothing on other systems)
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"
