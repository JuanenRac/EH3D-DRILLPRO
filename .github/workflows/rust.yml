name: EH3D Rust CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CODE_OF_CONDUCT.md"
      - "images/**"
  pull_request:
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CODE_OF_CONDUCT.md"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the sibling EH3D-COMMON (a path dependency)
        shell: bash
        run: git init -q ../EH3D-COMMON && git -C ../EH3D-COMMON fetch -q --depth 1 https://github.com/JuanenRac/EH3D-COMMON.git 6e3c7b0d71f9c93c6fe77ed3c1fc0e02c7c6f7dd && git -C ../EH3D-COMMON checkout -q FETCH_HEAD
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --features console -- -D warnings
      - name: Tests
        run: cargo test --no-fail-fast --workspace --all-targets --features console
      - name: Libraries of the window system (the graphical interface)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Lints of the graphical interface
        run: cargo clippy --workspace --all-targets --features gui -- -D warnings
      - name: Tests of the graphical interface
        run: cargo test --no-fail-fast --workspace --all-targets --features gui

      - name: Every dependency is in the third-party notices
        if: runner.os == 'Linux'
        shell: bash
        # the tool is EH3D-COMMON's, fetched by commit so that it does not depend on the sibling tag this build uses
        run: |
          git init -q "$RUNNER_TEMP/notices"
          git -C "$RUNNER_TEMP/notices" fetch -q --depth 1 https://github.com/JuanenRac/EH3D-COMMON.git ea71ffba79e0b9f37b1d6c80e992df662332eb8a
          git -C "$RUNNER_TEMP/notices" checkout -q FETCH_HEAD
          python3 -I "$RUNNER_TEMP/notices/tools/third_party_notices.py" --output docs/THIRD_PARTY_NOTICES --check
