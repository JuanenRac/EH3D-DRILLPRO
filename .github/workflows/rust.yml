name: EH3D Rust CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CODE_OF_CONDUCT.md"
      - "images/**"
  pull_request:
    paths-ignore:
      - "README*.md"
      - "CHANGELOG.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "SUPPORT.md"
      - "CODE_OF_CONDUCT.md"
      - "images/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out the sibling EH3D-COMMON (a path dependency)
        shell: bash
        run: git clone --depth 1 --branch v0.2.1 https://github.com/JuanenRac/EH3D-COMMON.git ../EH3D-COMMON
      - name: Rust toolchain
        shell: bash
        run: rustup toolchain install "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" --profile minimal --component rustfmt,clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Format
        run: cargo fmt --all --check
      - name: Lints
        run: cargo clippy --workspace --all-targets --features console -- -D warnings
      - name: Tests
        run: cargo test --workspace --all-targets --features console
      - name: Libraries of the window system (the graphical interface)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Lints of the graphical interface
        run: cargo clippy --workspace --all-targets --features gui -- -D warnings
      - name: Tests of the graphical interface
        run: cargo test --workspace --all-targets --features gui
